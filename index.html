<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Study App</title>
  <meta name="description" content="Practice questions for CompTIA Network+ and more.">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Study">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (dark by default) to avoid a flash.
    try { document.documentElement.dataset.theme = localStorage.getItem("studyapp.theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script src="data/netplus.js"></script>
  <script src="app.js"></script>
</body>
</html>
